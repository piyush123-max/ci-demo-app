apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-demo-app
  template:
    metadata:
      labels:
        app: ci-demo-app
    spec:
      containers:
        - name: ci-demo-app
          image: piyush421601/ci-demo-app:fde9afc5ae662a74f1036a576205a4478e7f1b81
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ci-demo-app-service
spec:
  type: NodePort
  selector:
    app: ci-demo-app
  ports:
    - port: 5000
      targetPort: 5000
